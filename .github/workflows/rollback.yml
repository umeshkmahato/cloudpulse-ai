# Roll one environment back: either to the previous ReplicaSet (fast, default) or to a specific released SHA.
name: rollback
on:
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [staging, production], required: true }
      sha: { description: "optional: redeploy this released SHA instead of `rollout undo`", required: false }
permissions: { contents: read, id-token: write }
jobs:
  rollback:
    if: vars.GCP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with: { workload_identity_provider: "${{ vars.GCP_WIF_PROVIDER }}", service_account: "${{ vars.GCP_DEPLOYER_SA }}" }
      - uses: google-github-actions/get-gke-credentials@v2
        with: { cluster_name: "${{ vars.GKE_CLUSTER }}", location: "${{ vars.GCP_REGION }}" }
      - name: undo
        if: inputs.sha == ''
        run: for d in $(kubectl -n cloudpulse get deploy -o name); do kubectl -n cloudpulse rollout undo "$d"; done
      - name: redeploy SHA
        if: inputs.sha != ''
        run: gh workflow run deploy.yml -f environment=${{ inputs.environment }} -f sha=${{ inputs.sha }}
        env: { GH_TOKEN: "${{ github.token }}" }
