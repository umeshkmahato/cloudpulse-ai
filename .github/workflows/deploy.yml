# Deploy a released SHA to an environment. The `environment:` key makes GitHub require the reviewers configured for it
# (staging: 1 reviewer, production: 2 reviewers + wait timer). Disabled until GCP_ENABLED=true.
name: deploy
on:
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [staging, production], required: true }
      sha: { description: "released commit SHA (must exist in the registry)", required: true }
permissions: { contents: read, id-token: write }
concurrency: { group: "deploy-${{ inputs.environment }}", cancel-in-progress: false }
jobs:
  deploy:
    if: vars.GCP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}   # approval gate
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.sha }}" }
      - uses: google-github-actions/auth@v3
        with: { workload_identity_provider: "${{ vars.GCP_WIF_PROVIDER }}", service_account: "${{ vars.GCP_DEPLOYER_SA }}" }
      - uses: google-github-actions/get-gke-credentials@v2
        with: { cluster_name: "${{ vars.GKE_CLUSTER }}", location: "${{ vars.GCP_REGION }}" }
      - name: verify image signatures before anything is applied
        run: |
          for i in order-service inventory-service operations-service analytics-sink ai-incident-assistant remediation-controller identity-service dashboard; do
            cosign verify --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloudpulse/$i:${{ inputs.sha }}" >/dev/null
          done
      - name: record the currently running revision (rollback point)
        run: kubectl -n cloudpulse get deploy -o jsonpath='{range .items[*]}{.metadata.name}={.spec.template.spec.containers[0].image}{"\n"}{end}' | tee previous-images.txt
      - run: |
          cd kubernetes/overlays/gke
          for i in order-service inventory-service operations-service analytics-sink ai-incident-assistant remediation-controller identity-service dashboard; do
            kustomize edit set image "cloudpulse/$i=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloudpulse/$i:${{ inputs.sha }}"
          done
          kubectl apply -k .
      - name: wait for rollouts; roll back automatically on failure
        run: |
          for d in order-service inventory-service operations-service analytics-sink ai-incident-assistant remediation-controller identity-service dashboard; do
            kubectl -n cloudpulse rollout status deploy/$d --timeout=300s || { echo "::error::$d failed; rolling back"; kubectl -n cloudpulse rollout undo deploy/$d; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: previous-images, path: previous-images.txt }
