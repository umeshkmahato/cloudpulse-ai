# Release: build immutable images tagged with the commit SHA, scan, push, sign. DISABLED until GCP exists:
# every cloud job needs the repository variable GCP_ENABLED=true (default unset => the jobs are skipped).
name: release
on:
  workflow_dispatch:
    inputs:
      ref: { description: "git ref to release", default: main, required: true }
permissions:
  contents: read
  id-token: write   # OIDC token for Workload Identity Federation: no service account keys anywhere
env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloudpulse
jobs:
  publish:
    if: vars.GCP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image:
          - { name: order-service, dir: services/order-service }
          - { name: inventory-service, dir: services/inventory-service }
          - { name: operations-service, dir: services/operations-service }
          - { name: analytics-sink, dir: data-pipeline/analytics-sink }
          - { name: ai-incident-assistant, dir: services/ai-incident-assistant }
          - { name: remediation-controller, dir: services/remediation-controller }
          - { name: identity-service, dir: services/identity-service }
          - { name: dashboard, dir: frontend/operations-dashboard }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref }}" }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - run: docker build -t "$REGISTRY/${{ matrix.image.name }}:${{ github.sha }}" "${{ matrix.image.dir }}"
      - name: scan before push (fail on CRITICAL/HIGH)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.58.2/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.2
          trivy image --severity CRITICAL,HIGH --exit-code 1 --ignorefile .trivyignore "$REGISTRY/${{ matrix.image.name }}:${{ github.sha }}"
      - run: docker push "$REGISTRY/${{ matrix.image.name }}:${{ github.sha }}"
      - uses: sigstore/cosign-installer@v3
      - name: sign by digest (keyless, bound to this workflow identity)
        run: cosign sign --yes "$REGISTRY/${{ matrix.image.name }}@$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/${{ matrix.image.name }}:${{ github.sha }}" | cut -d@ -f2)"
