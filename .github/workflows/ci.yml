# CI: runs on every PR and push to main. No cloud credentials are used or needed.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/order-service
          - services/inventory-service
          - services/operations-service
          - services/ai-incident-assistant
          - services/remediation-controller
          - services/identity-service
          - data-pipeline/analytics-sink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -q verify
        working-directory: ${{ matrix.module }}

  dashboard:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend/operations-dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/operations-dashboard/package-lock.json }
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npm run build

  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - name: terraform fmt + validate (no backend, no credentials)
        run: |
          terraform -chdir=infrastructure/terraform fmt -check -recursive
          for env in dev staging prod bootstrap; do
            d=infrastructure/terraform/environments/$env; [ -d "$d" ] || d=infrastructure/terraform/$env
            [ -d "$d" ] || continue
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
      - name: kustomize renders (local and gke overlays)
        run: |
          kubectl kustomize kubernetes/overlays/local >/dev/null
          kubectl kustomize kubernetes/overlays/gke >/dev/null

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.58.2/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.2
      - name: dependency, IaC and secret scans (fail on HIGH/CRITICAL)
        run: scripts/security-scan.sh deps && scripts/security-scan.sh iac && scripts/security-scan.sh secrets

  images:
    needs: [java, dashboard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.58.2/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.2
      - name: build all images (same tag the scan and the kind cluster use)
        run: |
          for i in services/order-service services/inventory-service services/operations-service data-pipeline/analytics-sink \
                   services/ai-incident-assistant services/remediation-controller services/identity-service frontend/operations-dashboard; do
            n=$(basename $i); [ $n = operations-dashboard ] && n=dashboard
            docker build -q -t cloudpulse/$n:0.1.0 $i >/dev/null
          done
      - name: scan the built images (fail on HIGH/CRITICAL; images are not pushed)
        run: scripts/security-scan.sh images

  cluster-e2e:
    # Spins up kind and runs the same checks used locally. Slower: only on main and on demand.
    if: github.event_name == 'push'
    needs: [java, dashboard, iac, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { install_only: true }
      - run: scripts/k8s-up.sh
      - run: scripts/k8s-verify.sh
      - run: scripts/k8s-security-verify.sh
      - run: scripts/k8s-remediation-e2e.sh
