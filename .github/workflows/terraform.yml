# Terraform: plan on PRs (read-only identity), apply only by manual dispatch against the plan that was reviewed.
# Disabled until GCP_ENABLED=true. Cost gates in the Terraform default to off; a plan that adds billable resources is flagged.
name: terraform
on:
  pull_request:
    paths: ["infrastructure/terraform/**"]
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [dev, staging, prod], required: true }
      plan_run_id: { description: "run id of the reviewed plan to apply", required: true }
permissions: { contents: read, id-token: write, pull-requests: write }
jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.GCP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    strategy: { matrix: { env: [dev, staging, prod] } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - uses: google-github-actions/auth@v3
        with: { workload_identity_provider: "${{ vars.GCP_WIF_PROVIDER }}", service_account: "${{ vars.GCP_PLANNER_SA }}" }   # read-only SA
      - run: |
          cd infrastructure/terraform/environments/${{ matrix.env }}
          terraform init -input=false
          terraform plan -input=false -lock-timeout=60s -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.env }}
          path: |
            infrastructure/terraform/environments/${{ matrix.env }}/tfplan
            infrastructure/terraform/environments/${{ matrix.env }}/plan.txt
  apply:
    if: github.event_name == 'workflow_dispatch' && vars.GCP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}-infra    # required reviewers: someone who read the plan and architecture/cost-estimate.md
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - uses: google-github-actions/auth@v3
        with: { workload_identity_provider: "${{ vars.GCP_WIF_PROVIDER }}", service_account: "${{ vars.GCP_TF_APPLIER_SA }}" }
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ inputs.environment }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
          path: infrastructure/terraform/environments/${{ inputs.environment }}
      - run: |
          cd infrastructure/terraform/environments/${{ inputs.environment }}
          terraform init -input=false
          terraform apply -input=false tfplan     # applies exactly the saved plan; stale plans are refused by Terraform
