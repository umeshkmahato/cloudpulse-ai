server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudpulse}
    username: ${POSTGRES_USER:cloudpulse}
    password: ${POSTGRES_PASSWORD}   # injected from env / Secret Manager; never hard-coded
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  flyway:
    schemas: orders
    default-schema: orders
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

cloudpulse:
  pubsub:
    project-id: ${GCP_PROJECT_ID:cloudpulse-ai-poc}
    emulator-host: ${PUBSUB_EMULATOR_HOST:}   # empty = real Pub/Sub with ADC
    orders-topic: orders-created
    inventory-subscription: inventory-updated-order-sub
    consumer-enabled: ${ORDER_CONSUMER_ENABLED:true}
  outbox:
    poll-interval-ms: 1000
    batch-size: 50
