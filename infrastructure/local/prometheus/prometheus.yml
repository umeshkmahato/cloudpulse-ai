# Services run on the host during local dev (ports 8081-8083); targets show DOWN until they exist.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8081"], labels: { service: order-service } }]
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8082"], labels: { service: inventory-service } }]
  - job_name: operations-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8083"], labels: { service: operations-service } }]
