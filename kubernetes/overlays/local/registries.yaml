apiVersion: v1
kind: ConfigMap
metadata: { name: cloudpulse-image-registries }
data:
  # local images are side-loaded as cloudpulse/<name>:<tag>; third-party images are pinned to these exact repositories
  allowedRegistries: "cloudpulse/,postgres:,curlimages/curl:,gcr.io/google.com/cloudsdktool/google-cloud-cli:"
