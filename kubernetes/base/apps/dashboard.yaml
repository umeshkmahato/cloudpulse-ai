apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  labels: { app.kubernetes.io/name: dashboard, app.kubernetes.io/part-of: cloudpulse }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: cloudpulse
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # zero-downtime rollouts
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: cloudpulse
    spec:
      serviceAccountName: dashboard
      automountServiceAccountToken: false      # only the remediation controller talks to the Kubernetes API
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      tolerations:                           # default is 300 s before pods on a dead node are evicted: far too slow for a 5 min RTO
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      topologySpreadConstraints:             # survive a zone or node loss
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule       # strict zone spread while zones are healthy ...
          nodeTaintsPolicy: Honor                # ... but a zone whose nodes are tainted unreachable/not-ready stops counting, so pods still schedule
          nodeAffinityPolicy: Honor
          matchLabelKeys: [pod-template-hash]    # spread each ReplicaSet on its own, so rolling updates cannot leave pods lopsided
          labelSelector:
            matchLabels: { app.kubernetes.io/name: dashboard }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: dashboard }
      containers:
        - name: app
          image: cloudpulse/dashboard:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }   # let endpoints drain before SIGTERM
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: nginx-conf
          emptyDir: { sizeLimit: 1Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels: { app.kubernetes.io/name: dashboard, app.kubernetes.io/part-of: cloudpulse }
spec:
  selector: { app.kubernetes.io/name: dashboard }
  ports:
    - { name: http, port: 8080, targetPort: http }
