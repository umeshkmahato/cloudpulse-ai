# Native ValidatingAdmissionPolicy (CEL, GA since Kubernetes 1.30): no extra controller to install or operate.
# Runs in the API server for every pod in the `cloudpulse` namespace, on top of Pod Security Admission.
# The image-registry allow-list is parameterised (ConfigMap `cloudpulse-image-registries`, defined per overlay).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: cloudpulse-workload-baseline }
spec:
  failurePolicy: Fail
  paramKind: { apiVersion: v1, kind: ConfigMap }
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "object.spec.containers.all(c, has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits && has(c.resources.requests))"
      message: "every container must declare resource requests and a memory limit"
    - expression: "object.spec.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))"
      message: "images must use an explicit, non-latest tag"
    - expression: "!has(object.spec.hostNetwork) || object.spec.hostNetwork == false"
      message: "hostNetwork is not allowed"
    - expression: "!has(object.spec.hostPID) || object.spec.hostPID == false"
      message: "hostPID is not allowed"
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: "hostPath volumes are not allowed"
    - expression: "object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)"
      message: "privileged containers are not allowed"
    - expression: "object.spec.containers.all(c, params.data['allowedRegistries'].split(',').exists(r, c.image.startsWith(r)))"
      message: "image comes from a registry that is not on the allow-list"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: cloudpulse-workload-baseline }
spec:
  policyName: cloudpulse-workload-baseline
  validationActions: [Deny, Audit]
  paramRef: { name: cloudpulse-image-registries, namespace: cloudpulse, parameterNotFoundAction: Deny }
  matchResources:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: cloudpulse }
