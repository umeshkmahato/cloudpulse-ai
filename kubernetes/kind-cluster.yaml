# Local 3-node cluster with two fake zones so topologySpreadConstraints / PDBs / drains are exercised.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloudpulse
nodes:
  - role: control-plane
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=zone-a"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=zone-b"
